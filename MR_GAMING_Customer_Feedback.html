<div class="card"><div class="head"><h1>MR GAMING</h1><div class="sub">Customer Feedback</div></div>
<div class="section"><div class="q">How was your experience?</div><div class="hint">Please rate us by selecting a star</div>
<div class="stars" id="stars"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div>
<div class="q">How satisfied are you?</div><div class="moods">
<div class="mood" data-m="Very Satisfied"><span>😀</span>Very Satisfied</div><div class="mood" data-m="Satisfied"><span>🙂</span>Satisfied</div><div class="mood" data-m="Neutral"><span>😐</span>Neutral</div><div class="mood" data-m="Unsatisfied"><span>🙁</span>Unsatisfied</div><div class="mood" data-m="Very Unsatisfied"><span>😞</span>Very Unsatisfied</div></div>
<label>Your Feedback / Comments</label><textarea id="comments" placeholder="আপনার মতামত লিখুন..."></textarea>
<button onclick="submitFeedback()">➤ SUBMIT FEEDBACK</button></div><div class="note">💜 Thank you for helping us improve!<br>We value your feedback.</div></div></div>
<script>
let rating=0,mood="";
document.querySelectorAll('.star').forEach(s=>s.onclick=()=>{rating=+s.dataset.v;document.querySelectorAll('.star').forEach(x=>x.classList.toggle('active',+x.dataset.v<=rating));});
document.querySelectorAll('.mood').forEach(m=>m.onclick=()=>{mood=m.dataset.m;document.querySelectorAll('.mood').forEach(x=>x.classList.remove('selected'));m.classList.add('selected');});
function submitFeedback(){
 if(!rating)return alert('Please select a star rating.');
 if(!mood)return alert('Please select your satisfaction level.');
 const data=JSON.parse(localStorage.getItem('mr_gaming_feedback')||'[]');
 data.unshift({rating,mood,comment:document.getElementById('comments').value.trim(),date:new Date().toLocaleString()});
 localStorage.setItem('mr_gaming_feedback',JSON.stringify(data));
 alert('ধন্যবাদ! আপনার Feedback গ্রহণ করা হয়েছে।');
 location.reload();
}
</script></body></html>
